services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meerkat
      POSTGRES_USER: meerkat
      POSTGRES_PASSWORD: meerkat_secure_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meerkat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80
      - AI_TEMPERATURE=0.7
      - AI_MAX_TOKENS=2000
      - DATABASE_URL=postgresql://meerkat:meerkat_secure_2026@postgres:5432/meerkat
      - JWT_SECRET_KEY=meerkat_jwt_production_key_2026
      - ENCRYPTION_KEY=3mnJfNWaQRo0uyauoe-7EHDIxezefYOQwi5118W4MOA=
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  postgres_data:
