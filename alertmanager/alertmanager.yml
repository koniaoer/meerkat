global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'meerkat-webhook'

receivers:
  - name: 'meerkat-webhook'
    webhook_configs:
      - url: 'http://backend:8000/api/v1/alerts'
        send_resolved: true
